<!DOCTYPE html>
<html lang="pt-BR">
<link rel="stylesheet" href="style.css">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Empréstimo de Materiais Esportivos</title>
</head>

<body>
    <nav class="nav">
       <h2 class="logo_surf">Surfland</h2>
        <div>
            <h1>Empréstimo de Materiais Esportivos</h1>
            <p>Selecione o material, leia a pulseira e vincule ao cliente.</p>
        </div>
        <button class="b sec" id="logoRm" hidden>Remover logo</button>
    </nav>
    <main>
        <section>
            <h2>1. Materiais</h2>
            <div class="grid" id="materiais"></div>
            <div class="row" style="margin-top:14px">
                <input id="novoMat" placeholder="Novo material (ex.: Raquete)" maxlength="40">
                <button class="b sec" id="btnAdd">Adicionar</button>
            </div>
            <p class="msg" id="msgAdd"></p>
        </section>

        <section>
            <h2>2. Cliente</h2>
            <div class="sel-box" id="selBox">Nenhum material selecionado</div>
            <label for="qr">Leia o QR code da pulseira</label>
            <div class="row"><input id="qr" placeholder="Aponte o scanner aqui" autocomplete="off"><button class="b sec"
                    id="btnBuscar">Buscar</button></div>
            <label for="nome">Nome</label><input id="nome" placeholder="Nome do cliente">
            <label for="cpf">CPF</label><input id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
            <p class="msg" id="msg"></p>
            <button class="b" id="btnVincular" disabled style="width:100%;margin-top:6px">Vincular</button>
        </section>

        <section class="full">
            <h2>Empréstimos em aberto</h2>
            <div class="scroll" id="ativos"></div>
        </section>
    </main>

    <script src="scripts.js"></script>
</body>

</html>
